name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  # The JVM, JS, wasm and Linux native targets. This is the job that runs the
  # full suite: the codecs are pure computation, so a pass here covers them
  # everywhere.
  linux:
    name: JVM / JS / wasm / native (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install executable oracles and build the pinned permissive references.
      # Missing tools are real skips, and the coverage step rejects unexpected ones.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the codec oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg flac lame libopusfile0 libmpg123-dev libimage-exiftool-perl cmake build-essential python3-venv musepack-tools
          bash .github/scripts/prepare-codec-oracles.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (JVM)
        run: python3 generate-test-fixtures.py

      - name: Verify oracle comparisons ran
        if: always()
        run: python3 .github/scripts/check-oracle-results.py

      - name: Core tests (JS + wasm)
        run: >-
          ./gradlew
          :audiokodec:jsNodeTest
          :audiokodec:wasmJsNodeTest
          :audiokodec:wasmWasiNodeTest
          :audiokodec-io:jsNodeTest
          :audiokodec-io:jsBrowserTest
          :audiokodec-io:wasmJsNodeTest
          :audiokodec-io:wasmWasiNodeTest
          --stacktrace

      - name: Hostile-input sweeps (Chromium)
        run: ./gradlew :audiokodec:jsBrowserTest --tests '*HostileInputTest*' --stacktrace

      - name: Core tests (native)
        run: ./gradlew :audiokodec:linuxX64Test :audiokodec-io:linuxX64Test --stacktrace

      - name: Public API check
        run: ./gradlew checkKotlinAbi --stacktrace

      - name: Check distribution attribution
        run: |
          ./gradlew :audiokodec:jvmJar :audiokodec:jvmSourcesJar :audiokodec:jsJar :audiokodec:wasmJsJar :audiokodec:wasmWasiJar :audiokodec:linuxX64Klib :audiokodec:jsNodeProductionLibraryDistribution :audiokodec-io:jvmJar :audiokodec-io:jsJar :audiokodec-io:jsNodeProductionLibraryDistribution :audiokodec-io:wasmJsJar :audiokodec-io:wasmWasiJar :audiokodec-io:linuxX64Klib generateDistributionPoms --stacktrace
          python3 .github/scripts/check-distribution-notices.py --package audiokodec/build/dist/js/productionLibrary --package audiokodec-io/build/dist/js/productionLibrary

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

      - name: Upload fixture provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-provenance-linux
          path: audiokodec/build/fixture-provenance/*.json*

  # MinGW binaries cross-compile elsewhere, but their tests can only execute
  # on Windows. Keep this separate from the JVM oracle suite so native failures
  # cannot hide behind a successful cross-compilation.
  windows:
    name: Kotlin/Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: MinGW x64 tests
        run: .\gradlew.bat :audiokodec:mingwX64Test :audiokodec-io:mingwX64Test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: '**/build/reports/tests/**'

  # Apple targets can only be built on a Mac, and they are a large part of why
  # this library exists, so they get their own job rather than riding along as
  # a compile-only check.
  apple:
    name: Apple targets (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the codec oracles
        run: |
          brew install ffmpeg flac lame exiftool opusfile mpg123 cmake musepack
          bash .github/scripts/prepare-codec-oracles.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests and Apple format comparisons (JVM)
        run: python3 generate-test-fixtures.py

      - name: Verify oracle comparisons ran
        if: always()
        run: python3 .github/scripts/check-oracle-results.py

      - name: Native tests
        run: >-
          ./gradlew
          :audiokodec:macosArm64Test
          :audiokodec:iosSimulatorArm64Test
          :audiokodec-io:macosArm64Test
          :audiokodec-io:iosSimulatorArm64Test
          --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-apple
          path: '**/build/reports/tests/**'

      - name: Upload fixture provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-provenance-apple
          path: audiokodec/build/fixture-provenance/*.json*

      - name: Check framework attribution
        run: |
          ./gradlew :audiokodec:linkReleaseFrameworkIosSimulatorArm64 :audiokodec-io:linkReleaseFrameworkIosSimulatorArm64 generateDistributionPoms --stacktrace
          python3 .github/scripts/check-distribution-notices.py --framework audiokodec/build/bin/iosSimulatorArm64/releaseFramework/AudioKodec.framework --framework audiokodec-io/build/bin/iosSimulatorArm64/releaseFramework/AudioKodecIO.framework

  # The Android variants build through AGP, which neither job above exercises.
  android:
    name: Android library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android host tests
        run: ./gradlew :audiokodec:testAndroidHostTest :audiokodec-io:testAndroidHostTest --stacktrace

      - name: Assemble every target
        run: ./gradlew :audiokodec:assemble :audiokodec-io:assemble --stacktrace

      - name: Check Android attribution
        run: |
          ./gradlew generateDistributionPoms --stacktrace
          python3 .github/scripts/check-distribution-notices.py

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Dokka site
        run: ./gradlew dokkaGenerate --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/dokka/html
