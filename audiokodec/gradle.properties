POM_NAME=AudioKodec
POM_DESCRIPTION=Audio containers, codecs and tags written in Kotlin for Kotlin Multiplatform. Decodes 22 containers to Float32 PCM, among them FLAC, WAV, AIFF, MP3, Ogg Vorbis and Opus, AAC, ALAC, AC-3, Matroska, WavPack and Monkey's Audio. Encodes FLAC, WAV, AIFF, AU and ALAC. Reads and edits ID3, APE, Vorbis comment, MP4 and RIFF tags with the audio left byte-identical. Names 30 formats by sniffing. Depends on kotlin-stdlib only and builds for 22 targets.
