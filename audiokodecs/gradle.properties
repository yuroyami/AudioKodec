POM_NAME=AudioKodecs
POM_DESCRIPTION=Pure-Kotlin audio core for Kotlin Multiplatform. Decodes and encodes FLAC (bit-exact, natively and inside Ogg, with stream MD5 verification), WAV (including RF64/BW64 and WAVE_FORMAT_EXTENSIBLE), AIFF and AIFF-C, Sun AU and raw PCM; decodes Vorbis; reads Wave64 and CAF; finds and measures MPEG audio frames including Xing, VBRI and LAME gapless information; reads the Ogg container in full, including Opus and Speex headers, length and comments. Codings include integer PCM at 8/16/24/32-bit, 32- and 64-bit float, A-law and mu-law, and IMA and Microsoft ADPCM. Reads and edits tags on any file: ID3v2.2/2.3/2.4, ID3v1, APEv1/APEv2, Vorbis comments, FLAC metadata blocks, Lyrics3, RIFF INFO, Broadcast Wave bext and AIFF text chunks, with the audio left byte-identical. Includes format sniffing across 29 audio formats, header-only probing, sample-accurate seeking, a Float32 PCM model with sample-format conversion and dither, and hostile-input guards. kotlin-stdlib only; 22 targets across Android, JVM, Apple, Linux, Windows, androidNative, JS and Wasm.
