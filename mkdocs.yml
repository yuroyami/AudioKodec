site_name: AudioKodec
site_url: https://yuroyami.github.io/AudioKodec/
site_description: Audio containers, codecs and tags written in Kotlin for Kotlin Multiplatform. Decode, encode and edit tags from common code.
site_author: yuroyami
copyright: Apache-2.0

repo_name: yuroyami/AudioKodec
repo_url: https://github.com/yuroyami/AudioKodec
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - theme/kite.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # Code samples are included from source files that compile and run as tests
  # (./gradlew :sample:docsTest, and :audiokodec:jsNodeTest for the Web Audio
  # one), between `// --8<-- [start:name]` and `// --8<-- [end:name]` markers.
  - pymdownx.snippets:
      base_path:
        - sample/src/docs/kotlin/io/github/yuroyami/audiokodec/docs
        - audiokodec/src/jsTest/kotlin/io/github/yuroyami/audiokodec/docs
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - Tasks:
      - tasks/index.md
      - Decode a file to PCM: tasks/decode.md
      - Stream and seek: tasks/stream-and-seek.md
      - Get gapless playback right: tasks/gapless.md
      - Read tags: tasks/read-tags.md
      - Edit tags: tasks/edit-tags.md
      - Read and write cover art: tasks/cover-art.md
      - Encode FLAC: tasks/encode-flac.md
      - Use kotlinx-io: tasks/kotlinx-io.md
      - Play decoded audio: tasks/play-audio.md
      - Measure loudness: loudness.md
      - Draw a waveform: waveform.md
      - Change the sample rate: resample.md
  - Guides:
      - Decoding: decoding.md
      - Encoding: encoding.md
      - Exact integer PCM: integer-pcm.md
      - Tags: tags.md
      - MP4 metadata: mp4-tags.md
      - Broadcast Wave metadata: broadcast-wave.md
      - Files and kotlinx-io: files.md
      - Seekable file input: file-input.md
  - Processing:
      - Mix channels: mix.md
      - Levels, fades and test signals: levels.md
  - Formats:
      - Overview: formats.md
      - Format support: support.md
      - AAC: aac.md
      - AC-3: ac3.md
      - AMR: amr.md
      - DSD: dsd.md
      - G.722 and G.726: g722-g726.md
      - GSM 06.10: gsm.md
      - iLBC: ilbc.md
      - Matroska and WebM: matroska.md
      - Monkey's Audio: ape.md
      - MPEG audio in MP4: mpeg-in-mp4.md
      - Free-format MPEG audio: mpeg-free-format.md
      - Musepack: musepack.md
      - Chained Ogg: ogg-chains.md
      - Speex: speex.md
      - True Audio: tta.md
      - Vorbis floor zero: vorbis-floor-zero.md
      - WavPack: wavpack.md
