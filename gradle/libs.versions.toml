[versions] #######################################################################################
# Toolchain. Kept in lock-step with KiteImage / KiteArchive / KitePDF so the Kite
# lineage builds with one shared stack. Values are pushed here by KiteVersions.
kotlin = "2.4.10"
agp = "9.2.1"
vanniktechPublish = "0.36.0"
dokka = "2.2.0"

# :audiokodecs-io only. The :audiokodecs core stays kotlin-stdlib-only.
kotlinx-io = "0.9.1"

[libraries] ######################################################################################
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
